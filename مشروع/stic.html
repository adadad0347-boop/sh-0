<style>
body {
  font-family: Arial;
  margin: 0;
  background:white;
  color: rgb(0, 0, 0);
  text-align: center;
}
h1 {
  padding: 20px;
}
.slider {
  width: 30%;
  height: 340px;
  margin: 30px auto;
  position: relative;
  background: white;
  border-radius: 15px;
  overflow: hidden;

  display: flex;
  justify-content: center;
  align-items: center;
}
@media (max-width: 767px) {
    
    /* 1. تكبير عرض السلايدر */
    .slider {
        width: 95% !important;
        margin: 10px auto;
    }
    .gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px;
        justify-content: center;
    }

    .gallery a {
        width: calc(50% - 15px); 
        text-decoration: none;
    }

    .gallery a img {
        width: 100% !important;
        height: auto;
        border-radius: 5px;
    }
}
.slider img {
  width: 100%;
  height: 100%;
  object-fit: contain; 
  position: absolute;
  opacity: 0;
  transition: 1s;
}

.slider img.active {
  opacity: 1;
}
/* المعرض */
.gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 15px; /* المسافة بين الصور */
    justify-content: center;
    padding: 20px;
}

.gallery a img {
    width: 200px; 
    height: 150px;
    object-fit: cover; 
    border-radius: 8px;
    transition: 0.3s;
    border: 1px solid #ddd;
}
.gallery a img:hover {
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}
</style>
</head>

<script>
let images = document.querySelectorAll('.slider img');
let index = 0;
setInterval(() => {
  images[index].classList.remove('active');
  index = (index + 1) % images.length;
  images[index].classList.add('active');
}, 3000);
</script>
